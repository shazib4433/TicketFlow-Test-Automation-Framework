spring:
  application:
    name: ticketflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${SERVER_PORT:8080}

notification:
  url: ${NOTIFICATION_URL:http://localhost:8089/notifications}

logging:
  level:
    com.ticketflow: ${LOG_LEVEL:INFO}
