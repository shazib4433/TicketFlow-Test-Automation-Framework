services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketflow}
      POSTGRES_USER: ${DB_USERNAME:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ticketflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/__admin/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  ticketflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketflow}
      DB_USERNAME: ${DB_USERNAME:-ticketflow}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      NOTIFICATION_URL: http://wiremock:8080/notifications
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ticketflow-postgres:
